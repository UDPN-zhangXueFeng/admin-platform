<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Kissen Gateway favicon: bank gateway arch with a clearing flow arrow.
       Palette matches the site brand: Kissen deep blue + cyan. -->
  <rect width="64" height="64" rx="14" fill="#001A98"/>
  <!-- Gateway arch (bank entrance / portal) -->
  <path d="M18 46V30a14 14 0 0 1 28 0v16" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Base line (bank plinth) -->
  <path d="M14 49h36" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Cross-bank clearing arrow passing through the gate -->
  <path d="M25 35h12m0 0-4.5-4.5M37 35l-4.5 4.5" stroke="#00A5D5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
