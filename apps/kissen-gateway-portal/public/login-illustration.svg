<svg width="720" height="560" viewBox="0 0 720 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .float-a{animation:float-a 5s ease-in-out infinite}.float-b{animation:float-b 6s ease-in-out infinite}.pulse{animation:pulse 3.2s ease-in-out infinite}.flow{animation:flow 6s linear infinite}@keyframes float-a{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes float-b{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}@keyframes flow{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){.float-a,.float-b,.pulse,.flow{animation:none}}
  </style>
  <defs>
