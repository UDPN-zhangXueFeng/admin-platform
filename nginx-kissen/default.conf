# nginx 反代配置：前端页面 → Next.js，后端 API /v1/ → NEXT_SERVICE_SERVER_URL
# 后端地址在 nginx 镜像构建期由 Dockerfile sed 替换 ${NEXT_SERVICE_SERVER_URL} 占位符。
# upstream 服务名 `app` 对应 docker-compose.kissen.yml 里的 app 服务（同 network 内 DNS 解析）。
#
# ⚠️ 与 admin（nginx/default.conf）的关键差异：
#    /aps/ 剥离前缀（proxy_pass ${URL}/;）vs /v1/ 保留前缀（proxy_pass ${URL};）。
#    kissen 后端网关按 /v1/* 路由，proxy_pass 千万不能带尾斜杠。

upstream nextjs_upstream {
  server app:3000;
}

map $http_upgrade $connection_upgrade {
  default          keep-alive;
  'websocket'      upgrade;
}

server {
  listen 80 default_server;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Host $http_host;

  # 前端页面 + Next.js 数据请求 → Next.js (app:3000)
  location / {
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
    add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,token';
    proxy_pass http://nextjs_upstream;
  }

  # 后端 API 代理：/v1/* → ${NEXT_SERVICE_SERVER_URL}/v1/*（前缀保留）
  location /v1/ {
    proxy_pass ${NEXT_SERVICE_SERVER_URL};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
